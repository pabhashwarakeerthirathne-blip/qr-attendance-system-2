<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#2563EB" />
  <meta name="description" content="Fast, lightweight, secure Student Event Attendance Management Web Application with QR Code scanning." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Padura2026" />

  <title>Padura2026 — Student Event Attendance Management</title>

  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="/assets/icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.svg" />

  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/scanner.css" />
  <link rel="stylesheet" href="/css/responsive.css" />

  <!-- Supabase JS Client (UMD for zero-build browser compatibility) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
</head>
<body>
  <!-- Root Application Container -->
  <div id="app-root" aria-live="polite">
    <div class="landing-wrapper">
      <div class="empty-state" style="margin: auto;">
        <div class="spinner-sm" style="margin-bottom: 0.75rem;"></div>
        <p>Loading attendance system...</p>
      </div>
    </div>
  </div>

  <!-- Modal Root -->
  <div id="modal-root" class="hidden" role="dialog" aria-modal="true"></div>

  <!-- Toast Notifications Container -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Main Application Entrypoint -->
  <script type="module" src="/js/app.js"></script>
</body>
</html>
